<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arman Qureshi | ATM Photo Cards</title>
<style>
html, body { margin:0; padding:0; font-family:Arial, sans-serif; background:#000; color:white; overflow-x:hidden; }
canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; }

/* Header */
header { text-align:center; padding:30px 0; }
h1 { font-size:48px; margin:0; }
.subtitle { margin:6px 0; opacity:0.8; font-size:18px; }
.btn { margin:5px; padding:10px 18px; border-radius:30px; text-decoration:none; font-weight:bold; transition:0.3s; display:inline-block; }
.btn:hover{ transform:scale(1.1); }
.whatsapp {background:#25D366;color:#000;}
.instagram {background:#E1306C;color:#fff;}
.facebook {background:#1877F2;color:#fff;}
.snapchat {background:#FFFC00;color:#000;}
.twitter {background:#1DA1F2;color:#fff;}
.telegram {background:#0088cc;color:#fff;}

/* Cards Section */
.section { padding:30px 20px; text-align:center; }
.cards { display:flex; flex-wrap:wrap; justify-content:center; gap:16px; }

/* ATM-style Cards */
.card-container { perspective:1000px; margin:15px; }
.card {
  width:220px; height:300px;
  position:relative; transform-style:preserve-3d;
  transition: transform 0.8s ease;
}
.card:hover { transform: rotateY(180deg); }

.card-front, .card-back {
  position:absolute; width:100%; height:100%;
  border-radius:15px; overflow:hidden; backface-visibility:hidden;
  box-shadow:0 0 15px rgba(0,255,0,0.4);
}
.card-front { background-size:cover; background-position:center; }
.card-back {
  background:rgba(0,0,0,0.9); color:#FFD700;
  transform:rotateY(180deg); display:flex;
  flex-direction:column; justify-content:center; align-items:center;
  font-weight:bold; font-size:18px;
}

/* Counters */
.value { font-size:28px; color:#FFD700; margin:8px 0; }

/* Footer */
footer { font-size:14px; opacity:0.6; margin:20px 0; }

/* Responsive */
@media (max-width:700px){ .card{width:90%;} .btn{margin:4px 2px;} }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<header>
  <h1>Arman Qureshi</h1>
  <div class="subtitle">Personal Photo Cards • Live Stats</div>
  <div>
    <a class="btn whatsapp" href="https://wa.me/9026550240">WhatsApp</a>
    <a class="btn instagram" href="https://www.instagram.com/armanqureshi2800">Instagram</a>
    <a class="btn facebook" href="https://www.facebook.com/share/19pPMX9SMV/">Facebook</a>
    <a class="btn snapchat" href="https://www.snapchat.com/add/armanqureshi_28">Snapchat</a>
    <a class="btn twitter" href="https://twitter.com/ArmanQureshi280">Twitter</a>
    <a class="btn telegram" href="https://t.me/Armanqureshi2800">Telegram</a>
  </div>
</header>

<section class="section">
  <h2>My 31 Photo Cards</h2>
  <div class="cards" id="cardsWrapper"></div>
</section>

<footer>© 2026 Arman Qureshi</footer>

<script>
// ===== Photo URLs =====
const photos = [
  'photo1.jpg','photo2.jpg','photo3.jpg','photo4.jpg','photo5.jpg',
  'photo6.jpg','photo7.jpg','photo8.jpg','photo9.jpg','photo10.jpg',
  'photo11.jpg','photo12.jpg','photo13.jpg','photo14.jpg','photo15.jpg',
  'photo16.jpg','photo17.jpg','photo18.jpg','photo19.jpg','photo20.jpg',
  'photo21.jpg','photo22.jpg','photo23.jpg','photo24.jpg','photo25.jpg',
  'photo26.jpg','photo27.jpg','photo28.jpg','photo29.jpg','photo30.jpg',
  'photo31.jpg'
];

const wrapper = document.getElementById('cardsWrapper');
photos.forEach((photo, index) => {
  const container = document.createElement('div'); container.className='card-container';
  const card = document.createElement('div'); card.className='card';

  const front = document.createElement('div'); front.className='card-front'; front.style.backgroundImage=`url(${photo})`;
  const back = document.createElement('div'); back.className='card-back'; back.innerHTML=`Card ${index+1}`;

  card.appendChild(front); card.appendChild(back); container.appendChild(card); wrapper.appendChild(container);
});

// ===== Particle Background =====
const canvas=document.getElementById('bg'), ctx=canvas.getContext('2d');
canvas.width=innerWidth; canvas.height=innerHeight;
let pArr=[]; for(let i=0;i<130;i++){ pArr.push({x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:Math.random()*3+1, s:Math.random()*0.4+0.2}); }
function anim(){ ctx.clearRect(0,0,canvas.width,canvas.height); pArr.forEach(p=>{ p.y -= p.s; if(p.y<0)p.y=canvas.height; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle='rgba(0,255,0,0.7)'; ctx.fill(); }); requestAnimationFrame(anim);}
anim();
</script>

</body>
</html>
